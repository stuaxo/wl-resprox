---
- name: Provision Wayland Proxy Dev Environment
  hosts: localhost
  connection: local
  become: yes

  tasks:
    - name: Update apt cache and upgrade packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist

    - name: Install Rust toolchain
      ansible.builtin.apt:
        name:
          - rustc
          - cargo
        state: present

    - name: Install GTK4 testing tools
      ansible.builtin.apt:
        name:
          - libgtk-4-dev
          - gtk-4-examples
        state: present

    - name: Install Wayland dev packages and nested compositor
      ansible.builtin.apt:
        name:
          - labwc
          - libwayland-dev
          - wayland-utils
          - dbus
          - wev
        state: present

    # GPU/render device access. The `render` group doesn't exist in the
    # base Ubuntu image by default; `video` usually does, but we set both
    # explicitly (by GID, not name) to match the host so /dev/dri device
    # ownership lines up — see scripts/setup-env.sh's --group-add comment
    # and docs/debugging-notes.md for why --group-add at container-create
    # time is *also* required for this group membership to actually reach
    # exec sessions (`distrobox enter --root`), not just this playbook.
    - name: Ensure render group exists at the host's GID
      ansible.builtin.group:
        name: render
        gid: 991
        state: present

    - name: Ensure video group exists at the host's GID
      ansible.builtin.group:
        name: video
        gid: 44
        state: present

    - name: Add container user to video and render groups
      ansible.builtin.user:
        name: stu
        groups: video,render
        append: yes

    # Distrobox's own container-init script (/usr/bin/entrypoint) clears
    # stu's password unconditionally on first boot (sets an empty hash via
    # `chpasswd -e`) and, for rootful containers, just locks `root` — it
    # never leaves stu with a working credential OR a NOPASSWD sudoers
    # rule. That means any `sudo` call as stu (interactive or scripted)
    # hits a password prompt that literally nothing can satisfy — there's
    # no correct password to type, since none was ever set. See the
    # 2026-07-29 entry in docs/debugging-notes.md. This is a disposable
    # dev container (not a shared/production box), so — matching the
    # standard convention in most devcontainer-style setups — we just make
    # stu's sudo passwordless rather than trying to manage a real one.
    - name: Allow stu passwordless sudo (dev container, no real credential exists otherwise)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/zz-stu-nopasswd
        content: "stu ALL=(ALL) NOPASSWD: ALL\n"
        mode: "0440"
        validate: "visudo -cf %s"
