# Drop-in for the wl-res-gnome-shell session ONLY -- instance-specific
# (org.gnome.Shell@wl-res-gnome-shell.service), cannot affect
# org.gnome.Shell@ubuntu.service or any other instance of the shared
# /usr/lib/systemd/user/org.gnome.Shell@.service template. See
# plan-desktop-resilience.md's "Recommended design" section for the full
# reasoning; this file implements point 1 there.
#
# --mode=ubuntu is required explicitly (not left to the template's
# --mode=%i) because the instance name here is "wl-res-gnome-shell", not a
# real gnome-shell UI mode -- only ubuntu.json and initial-setup.json exist
# under /usr/share/gnome-shell/modes/ on this box.
#
# --wayland-display= pins gnome-shell to a private socket name that only
# wayland-proxy-gnome-shell.service connects to; every other session
# component (settings daemon, portals, dock, apps) is meant to see the
# proxy's public socket instead -- see that unit and its own comments.

[Unit]
# CONFIRMED LIVE 2026-08-03 (real `pkill -9 gnome-shell`, not a plain
# SIGTERM -- that just exits cleanly and triggers neither path, see the
# plan doc): OnFailure= DOES still fire alongside Restart=on-failure, and
# they race. Observed sequence: Main process exited, code=killed,
# status=9/KILL -> Failed with result 'signal' -> "Triggering OnFailure=
# dependencies" AND "Scheduled restart job" both logged within the same
# second -> the resulting restart attempt was itself stopped ~1s later
# (OnFailure='s gnome-session-shutdown.target chain won that round) -> a
# further restart attempt ~24s after that finally stuck. Net effect: the
# session recovers, but not instantly and not deterministically-first-try
# -- roughly 28s and 3 start attempts in this run. Not chased further yet
# (StartLimitBurst=5 gives some headroom before systemd gives up outright,
# and 28s is far better than the old "whole session dies, back to gdm"
# baseline) -- but don't assume the FIRST restart attempt is the one that
# lands.
StartLimitIntervalSec=60
StartLimitBurst=5
# Overridden to empty 2026-08-03: confirmed live this genuinely races
# Restart=on-failure -- sometimes the in-place restart wins (session
# recovers to the lock screen), sometimes this OnFailure=-triggered
# gnome-session-shutdown.target chain wins instead (full teardown, back
# to the GDM login screen), nondeterministically, run to run. Cleared
# here since this instance is isolated from the everyday `ubuntu` session
# -- safe to experiment with in a way the plan doc says it explicitly
# isn't for the shared unit. Tradeoff: if Restart=on-failure ever
# genuinely gives up (StartLimitBurst=5 exhausted), there is now no
# automatic fallback at all -- a permanently stuck black screen needing a
# manual `systemctl restart gdm`, same as the plain-SIGTERM case. Revisit
# if that's hit in practice.
OnFailure=

[Service]
ExecStart=
ExecStart=/usr/bin/gnome-shell --mode=ubuntu --wayland-display=wl-res-gnome-shell-0
Restart=on-failure
RestartSec=1
# Re-export WAYLAND_DISPLAY after EVERY gnome-shell (re)start, not just
# once -- found live 2026-08-03 the hard way: gnome-shell re-exports its
# own private WAYLAND_DISPLAY on every one of ITS restarts (there were 3
# in a single crash-recovery cycle above), always winning the race against
# a one-shot export elsewhere. Putting the export on wayland-proxy's own
# unit (ExecStartPost there, see wayland-proxy-gnome-shell.service) only
# covers the proxy's own single startup -- it does nothing on gnome-shell's
# OWN subsequent restarts within the same session. This is the actual bug
# behind a real client (gnome-terminal) not surviving a real crash test:
# it was launched after a gnome-shell restart had already re-clobbered
# WAYLAND_DISPLAY back to the private socket, so it connected straight to
# gnome-shell, never through the proxy at all -- the proxy's own
# freeze-and-reconnect logic never got a chance to matter.
ExecStartPost=/bin/sh -c 'dbus-update-activation-environment --systemd WAYLAND_DISPLAY=wayland-0'
