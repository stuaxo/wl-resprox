# Mirrors /usr/lib/systemd/user/gnome-session@ubuntu.target.d/ubuntu.session.conf
# (shipped by the ubuntu-session package), the actual mechanism that pulls
# gnome-shell into a session at all -- found live 2026-08-03 after the
# wl-res-gnome-shell session came up with no compositor (blank screen,
# gnome-session-initialized.target reached, org.gnome.Shell@wl-res-gnome-shell.service
# never even attempted). Nothing generic wires an instance of
# org.gnome.Shell@.service into a gnome-session@<name>.target -- each
# session name needs its own copy of this, same as ubuntu has. Without
# this, wayland-proxy starts and listens fine but has nothing to connect
# to, which is exactly what was observed.
[Unit]
Requires=gnome-session-services.target
Requires=org.gnome.Shell@wl-res-gnome-shell.service
