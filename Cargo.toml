[package]
name = "wayland-proxy"
version = "0.1.0"
edition = "2021"
description = "A crash-resilient stateful Wayland proxy"
license = "MIT"

# cargo-deb (Phase 7, plan-test-harness.md). No systemd-units table here
# deliberately -- cargo-deb's automation is system-unit-oriented
# (installs to /usr/lib/systemd/system/, auto-generates
# postinst-systemd-enable/-start assuming root-context install-time
# enable), wrong for packaging/wayland-proxy.service, which is
# deliberately a --user unit (WAYLAND_DISPLAY/XDG_RUNTIME_DIR are
# per-user-session concepts -- see that file's own header). Shipped as a
# plain asset at the correct /usr/lib/systemd/user/ path instead; a user
# opts in themselves with `systemctl --user enable --now wayland-proxy`,
# same as any other optional user-session service.
[package.metadata.deb]
maintainer = "Stuart Axon <stuaxo2@yahoo.com>"
copyright = "2026, Stuart Axon <stuaxo2@yahoo.com>"
license-file = ["LICENSE", "0"]
extended-description = """\
A crash-resilient Wayland proxy. Relays a client to a compositor via \
direct wire-protocol translation, and survives the compositor crashing \
and restarting without the client noticing."""
section = "net"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/wayland-proxy", "usr/bin/", "755"],
    ["packaging/wayland-proxy.service", "usr/lib/systemd/user/", "644"],
]

[dependencies]
# Async runtime for socket multiplexing
tokio = { version = "1.37", features = ["full"] }

# Used as a static protocol data dictionary ONLY (Interface/MessageDesc/
# ArgumentType, generated by wayland-scanner) -- NOT for their Backend/
# ObjectData/GlobalHandler runtimes. Those are built for endpoints (a pure
# client or pure server), which actively fights building a proxy; see
# docs/architecture-context.md section 4. The actual relay in main.rs
# hand-parses the wire format itself (src/wire.rs) and looks up signatures
# in these crates' generated tables purely as data.
wayland-backend = { version = "0.3.7", features = ["server_system", "client_system"] }
wayland-client = "0.31.2"
wayland-server = "0.31.2"

# Interface tables for protocol extensions beyond core wayland.xml --
# freedesktop's official extensions (xdg-shell, linux-dmabuf,
# presentation-time, etc. -- "staging"/"unstable" unlock the trees those
# names imply, "stable" ones are always compiled in), plus the two other
# extension families every real wlroots-based compositor (labwc, sway, ...)
# advertises in practice: wlroots' own zwlr_* protocols, and KDE's
# org_kde_kwin_* ones. See the 2026-07-30 entries in
# docs/debugging-notes.md for why silently not recognizing a real
# compositor's global is a correctness bug, not just a coverage gap.
wayland-protocols = { version = "0.32", features = ["client", "server", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client", "server"] }
wayland-protocols-plasma = { version = "0.3", features = ["client", "server"] }
# zwp_virtual_keyboard_manager_v1 / zwp_input_method_manager_v2: neither ships
# in wayland-protocols proper (never went through freedesktop's official
# extension process) nor in the wlr crate (not wlroots-specific despite the
# zwp_ prefix) -- this is the smithay/wayland-rs family's catch-all crate for
# extensions that don't fit either of those buckets.
wayland-protocols-misc = { version = "0.3", features = ["client", "server"] }

# Bidirectional maps for Object ID translation
bimap = "0.6.3"

# Logging and error handling
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
anyhow = "1.0.81"

# CLI parsing. "env" feature: --flag falls back to a same-named
# environment variable when not given (see src/cli.rs) -- not on by
# default in clap 4.x.
clap = { version = "4", features = ["derive", "env"] }

# recvmsg/sendmsg with SCM_RIGHTS ancillary data -- tokio's UnixStream
# read/write don't carry file descriptors at all, which is exactly the bug
# that motivated moving off a raw byte pipe originally. Same crate
# sommelier-rs and waypipe both use for this.
nix = { version = "0.31.3", features = ["socket", "fs", "uio"] }
